<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>DIMI — TTI02</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: #0a0a0a;
      color: #e0d8c8;
      font-family: 'Courier New', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }

    #app {
      width: min(100vw, calc(100dvh * 0.5625));
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 8px;
    }

    /* HEADER */
    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .logo {
      font-size: 30px;
      font-weight: bold;
      letter-spacing: 0.15em;
      line-height: 1;
    }

    .inst-display {
      text-align: right;
      max-width: 60%;
    }

    .inst-num {
      font-size: 8px;
      color: #444;
      letter-spacing: 0.1em;
      margin-bottom: 2px;
    }

    .inst-name {
      font-size: 9px;
      color: #ff6b35;
      letter-spacing: 0.06em;
      line-height: 1.3;
    }

    /* SEQUENCER */
    .sequencer {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 5px;
      min-height: 0;
    }

    .step {
      background: #141414;
      border: 1.5px solid #222;
      border-radius: 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 5px 4px 4px;
      position: relative;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.08s, border-color 0.08s;
    }

    .step.on {
      border-color: #ff6b35;
      background: #1a0f08;
    }

    .step.playing {
      background: #ff6b35 !important;
      border-color: #ffe66d !important;
    }

    .step.playing .step-num { color: rgba(0,0,0,0.5); }
    .step.playing .k-label { color: rgba(0,0,0,0.4); }
    .step.playing .knob-bg { stroke: rgba(0,0,0,0.2); }
    .step.playing .knob-dot { fill: rgba(0,0,0,0.7); }

    .step-top {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .step-num {
      font-size: 7px;
      color: #333;
      line-height: 1;
    }
    .step.on .step-num { color: #ff6b35; }

    .step-inst {
      font-size: 6px;
      color: #333;
      text-align: right;
      max-width: 65%;
      line-height: 1.2;
      overflow: hidden;
    }
    .step.on .step-inst { color: #666; }

    .step-knobs {
      display: flex;
      gap: 3px;
      align-items: flex-end;
    }

    .k-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
    }

    .k-label {
      font-size: 6px;
      color: #333;
      letter-spacing: 0.04em;
    }
    .step.on .k-label { color: #555; }

    .k-svg {
      width: 24px;
      height: 24px;
      touch-action: none;
      cursor: ns-resize;
      flex-shrink: 0;
    }

    /* GLOBALS */
    .globals {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      padding: 0 2px;
    }

    .g-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .g-label {
      font-size: 8px;
      letter-spacing: 0.1em;
      color: #444;
    }

    .g-svg {
      width: 50px;
      height: 50px;
      touch-action: none;
      cursor: ns-resize;
    }

    .g-value {
      font-size: 9px;
      color: #ffe66d;
    }

    /* BUTTONS */
    .btns {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .btn-row { display: flex; gap: 6px; }

    .btn {
      border-radius: 50%;
      border: 1.5px solid #e0d8c8;
      background: transparent;
      color: #e0d8c8;
      font-family: 'Courier New', monospace;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.2;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: transform 0.08s, opacity 0.08s;
    }

    .btn:active { transform: scale(0.9); opacity: 0.6; }

    .btn.play {
      width: 50px; height: 50px;
      border-color: #ff6b35;
      color: #ff6b35;
      font-size: 20px;
    }

    .btn.play.on {
      background: #ff6b35;
      color: #000;
    }

    .btn.sm {
      width: 36px; height: 36px;
      font-size: 7px;
      letter-spacing: 0.04em;
    }

    .btn.rnd { border-color: #4ecdc4; color: #4ecdc4; }
    .btn.new { border-color: #ffe66d; color: #ffe66d; }

    /* LOADING */
    #loading {
      position: fixed;
      inset: 0;
      background: #0a0a0a;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    #loading.hidden { display: none; }

    .load-logo {
      font-size: 36px;
      font-weight: bold;
      letter-spacing: 0.15em;
    }

    .load-bar {
      width: 120px;
      height: 1px;
      background: #222;
    }

    .load-fill {
      height: 100%;
      background: #ff6b35;
      width: 0%;
      transition: width 0.4s;
    }

    .load-text {
      font-size: 8px;
      letter-spacing: 0.15em;
      color: #ff6b35;
    }
  </style>
</head>
<body>

<div id="loading">
  <div class="load-logo">DIMI</div>
  <div class="load-bar"><div class="load-fill" id="lf"></div></div>
  <div class="load-text" id="lt">TTI02</div>
</div>

<div id="app">
  <div class="header">
    <div class="logo">DIMI</div>
    <div class="inst-display">
      <div class="inst-num" id="inst-num">—</div>
      <div class="inst-name" id="inst-name">—</div>
    </div>
  </div>

  <div class="sequencer" id="seq"></div>

  <div class="globals">
    <div class="g-wrap">
      <div class="g-label">BPM</div>
      <svg class="g-svg" id="bpm-svg" viewBox="0 0 50 50">
        <circle cx="25" cy="25" r="18" fill="none" stroke="#1e1e1e" stroke-width="2.5" stroke-linecap="round"/>
        <path id="bpm-arc" fill="none" stroke="#ffe66d" stroke-width="2.5" stroke-linecap="round"/>
        <line id="bpm-ptr" x1="25" y1="25" x2="25" y2="9" stroke="#e0d8c8" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <div class="g-value" id="bpm-val">120</div>
    </div>

    <div class="btns">
      <div class="btn-row">
        <button class="btn sm rnd" id="rnd-btn">RND</button>
        <button class="btn sm new" id="new-btn">NEW<br>INST</button>
      </div>
      <button class="btn play" id="play-btn">▶</button>
    </div>

    <div class="g-wrap">
      <div class="g-label">DRIVE</div>
      <svg class="g-svg" id="drv-svg" viewBox="0 0 50 50">
        <circle cx="25" cy="25" r="18" fill="none" stroke="#1e1e1e" stroke-width="2.5" stroke-linecap="round"/>
        <path id="drv-arc" fill="none" stroke="#ff6b35" stroke-width="2.5" stroke-linecap="round"/>
        <line id="drv-ptr" x1="25" y1="25" x2="25" y2="9" stroke="#e0d8c8" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
  </div>
</div>

<script>
// ============================================================
// DIMI — TTI02 — by Alon Braier
// ============================================================

const SOUNDS_URL = 'https://alonbraier.github.io/dado/sounds/';

const INSTRUMENTS = [
  { name: 'Acoustic Grand Piano', file: 'acoustic_grand_piano', key: 'acoustic_grand_piano' },
  { name: 'Vibraphone',           file: 'vibraphone',           key: 'vibraphone' },
  { name: 'Music Box',            file: 'music_box',            key: 'music_box' },
  { name: 'Ocarina',              file: 'ocarina',              key: 'ocarina' },
  { name: 'Kalimba',              file: 'kalimba',              key: 'kalimba' },
  { name: 'Steel Drums',          file: 'steel_drums',          key: 'steel_drums' },
  { name: 'Choir Aahs',           file: 'choir_aahs',           key: 'choir_aahs' },
  { name: 'Voice Oohs',           file: 'voice_oohs',           key: 'voice_oohs' },
  { name: 'Flute',                file: 'flute',                key: 'flute' },
  { name: 'Alto Sax',             file: 'alto_sax',             key: 'alto_sax' },
  { name: 'Square Lead',          file: 'square_lead',          key: 'square_lead' },
  { name: 'Synth Bass',           file: 'synth_bass_1',         key: 'synth_bass_1' },
  { name: 'Melodic Tom',          file: 'melodic_tom',          key: 'melodic_tom' },
];

// State
let audioCtx, waveShaper;
let isPlaying = false, seqTimer = null, curStep = -1;
let bpm = 120, driveAmt = 0;
let loadedFonts = {}; // cache loaded fonts

// Per-step state — each step has its own instrument
const steps = Array.from({length: 16}, (_, i) => ({
  on: Math.random() > 0.4,
  instIdx: Math.floor(Math.random() * INSTRUMENTS.length),
  pitch: 48 + Math.floor(Math.random() * 24),
  decay: 0.15 + Math.random() * 1.2,
  pa: 0, da: 0,
  font: null,
}));

// Sync knob angles from values
steps.forEach(s => {
  s.pa = ((s.pitch - 36) / 48) * 270;
  s.da = ((s.decay - 0.05) / 1.95) * 270;
});

// ============================================================
// LOAD SOUNDFONT
// ============================================================
function loadScript(url) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = url;
    s.onload = res;
    s.onerror = rej;
    document.head.appendChild(s);
  });
}

async function loadInstrumentAudio(instIdx) {
  if (loadedFonts[instIdx]) return loadedFonts[instIdx];
  const inst = INSTRUMENTS[instIdx];
  const url = SOUNDS_URL + inst.file + '-mp3.js';

  try {
    await loadScript(url);

    // MIDI.Soundfont.vibraphone = { "A0": "data:audio/mp3;base64,..." }
    const noteMap = window.MIDI && window.MIDI.Soundfont && window.MIDI.Soundfont[inst.key];
    if (!noteMap) {
      console.warn('Available MIDI.Soundfont keys:', window.MIDI && window.MIDI.Soundfont ? Object.keys(window.MIDI.Soundfont) : 'none');
      throw new Error('MIDI.Soundfont.' + inst.key + ' not found');
    }

    const buffers = {};
    const notesToLoad = Object.keys(noteMap); // load ALL notes

    await Promise.all(notesToLoad.map(async note => {
      try {
        const dataUrl = noteMap[note];
        const base64 = dataUrl.split(',')[1];
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        const ab = await audioCtx.decodeAudioData(bytes.buffer.slice(0));
        buffers[note] = ab;
      } catch(e) {}
    }));

    loadedFonts[instIdx] = buffers;
    return buffers;
  } catch(e) {
    console.warn('Failed to load', inst.name, e);
    return null;
  }
}

function midiToNote(midi) {
  const notes = ['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
  const octave = Math.floor(midi / 12) - 1;
  return notes[midi % 12] + octave;
}

function noteToMidi(note) {
  const notes = ['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
  const octave = parseInt(note.slice(-1));
  const base = note.slice(0, -1);
  const idx = notes.indexOf(base);
  if (idx === -1) return -1;
  return (octave + 1) * 12 + idx;
}

function findClosestBuffer(buffers, targetMidi) {
  const allNotes = Object.keys(buffers);
  if (allNotes.length === 0) return null;
  let closest = null, minDist = 999;
  allNotes.forEach(n => {
    const m = noteToMidi(n);
    if (m === -1) return;
    const dist = Math.abs(m - targetMidi);
    if (dist < minDist) { minDist = dist; closest = n; }
  });
  return closest ? buffers[closest] : null;
}

function playBuffer(buffer, when, duration, detune) {
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  if (detune) src.detune.value = detune;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.8, when);
  gain.gain.exponentialRampToValueAtTime(0.001, when + duration);
  src.connect(gain);
  gain.connect(waveShaper);
  src.start(when);
  src.stop(when + duration + 0.1);
}

async function playStep(i) {
  if (!audioCtx) return;
  const s = steps[i];
  if (!s.on) return;

  const inst = INSTRUMENTS[s.instIdx];
  document.getElementById('inst-num').textContent = 'GM ' + s.instIdx;
  document.getElementById('inst-name').textContent = inst.name.toUpperCase();

  // Load if not cached
  if (!loadedFonts[s.instIdx]) {
    loadedFonts[s.instIdx] = 'loading';
    loadedFonts[s.instIdx] = await loadInstrumentAudio(s.instIdx);
  }

  const buffers = loadedFonts[s.instIdx];
  if (!buffers || buffers === 'loading' || typeof buffers === 'string') return;

  const noteName = midiToNote(s.pitch);
  let buf = buffers[noteName] || findClosestBuffer(buffers, s.pitch);
  if (buf) playBuffer(buf, audioCtx.currentTime, s.decay, 0);
}

// ============================================================
// PRELOAD first few instruments
// ============================================================
async function preloadInitial() {
  document.getElementById('lt').textContent = 'LOADING...';
  document.getElementById('lf').style.width = '10%';

  // Get unique instruments used in initial steps
  const uniqueInsts = [...new Set(steps.map(s => s.instIdx))].slice(0, 3);

  for (let i = 0; i < uniqueInsts.length; i++) {
    document.getElementById('lt').textContent = 'LOADING ' + INSTRUMENTS[uniqueInsts[i]].name.toUpperCase() + '...';
    document.getElementById('lf').style.width = (10 + (i+1) * 25) + '%';
    await loadInstrumentAudio(uniqueInsts[i]);
  }

  document.getElementById('lf').style.width = '100%';
  setTimeout(() => document.getElementById('loading').classList.add('hidden'), 300);
}

// ============================================================
// BUILD UI
// ============================================================
function buildSeq() {
  const seq = document.getElementById('seq');
  seq.innerHTML = '';
  steps.forEach((s, i) => {
    const inst = INSTRUMENTS[s.instIdx];
    const el = document.createElement('div');
    el.className = 'step' + (s.on ? ' on' : '');
    el.dataset.i = i;
    el.innerHTML = `
      <div class="step-top">
        <div class="step-num">${String(i+1).padStart(2,'0')}</div>
        <div class="step-inst">${inst.name.replace(' ','\n')}</div>
      </div>
      <div class="step-knobs">
        <div class="k-wrap">
          <svg class="k-svg" data-si="${i}" data-p="p" viewBox="0 0 24 24">
            <circle class="knob-bg" cx="12" cy="12" r="8" fill="none" stroke="#2a2a2a" stroke-width="1.5" stroke-linecap="round"/>
            <path id="pa${i}" fill="none" stroke="#ff6b35" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
            <circle class="knob-dot" id="pd${i}" cx="12" cy="4" r="1.8" fill="#e0d8c8"/>
          </svg>
          <div class="k-label">PCH</div>
        </div>
        <div class="k-wrap">
          <svg class="k-svg" data-si="${i}" data-p="d" viewBox="0 0 24 24">
            <circle class="knob-bg" cx="12" cy="12" r="8" fill="none" stroke="#2a2a2a" stroke-width="1.5" stroke-linecap="round"/>
            <path id="da${i}" fill="none" stroke="#4ecdc4" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
            <circle class="knob-dot" id="dd${i}" cx="12" cy="4" r="1.8" fill="#e0d8c8"/>
          </svg>
          <div class="k-label">DEC</div>
        </div>
      </div>`;

    // Toggle on tap
    let moved = false;
    el.addEventListener('pointerdown', () => moved = false);
    el.addEventListener('pointermove', () => moved = true);
    el.addEventListener('pointerup', e => {
      if (!moved && !e.target.closest('.k-svg')) {
        s.on = !s.on;
        el.classList.toggle('on', s.on);
      }
    });

    seq.appendChild(el);
    updateKnob(i, 'p');
    updateKnob(i, 'd');
  });
  setupKnobDrag();
}

function updateKnob(i, p) {
  const s = steps[i];
  const angle = p === 'p' ? s.pa : s.da;
  const cx = 12, cy = 12, r = 8;
  const sa = -135 * Math.PI / 180;
  const ea = (angle - 135) * Math.PI / 180;
  const x1 = cx + r * Math.sin(sa), y1 = cy - r * Math.cos(sa);
  const x2 = cx + r * Math.sin(ea), y2 = cy - r * Math.cos(ea);
  const arc = document.getElementById(`${p}a${i}`);
  const dot = document.getElementById(`${p}d${i}`);
  if (arc) arc.setAttribute('d', angle > 1 ? `M${x1} ${y1} A${r} ${r} 0 ${angle>180?1:0} 1 ${x2} ${y2}` : '');
  if (dot) { dot.setAttribute('cx', cx + r*Math.sin(ea)); dot.setAttribute('cy', cy - r*Math.cos(ea)); }
}

// ============================================================
// KNOB DRAG
// ============================================================
function setupKnobDrag() {
  document.querySelectorAll('.k-svg').forEach(k => {
    let drag = null, sy = 0, sa = 0;
    k.addEventListener('pointerdown', e => {
      e.stopPropagation();
      const si = parseInt(k.dataset.si), p = k.dataset.p;
      drag = { si, p };
      sy = e.clientY;
      sa = p === 'p' ? steps[si].pa : steps[si].da;
      k.setPointerCapture(e.pointerId);
    });
    k.addEventListener('pointermove', e => {
      if (!drag) return;
      const { si, p } = drag;
      const na = Math.max(0, Math.min(270, sa + (sy - e.clientY) * 2));
      if (p === 'p') { steps[si].pa = na; steps[si].pitch = 36 + Math.round((na/270)*48); }
      else { steps[si].da = na; steps[si].decay = 0.05 + (na/270)*1.95; }
      updateKnob(si, p);
    });
    k.addEventListener('pointerup', () => drag = null);
  });
}

// ============================================================
// GLOBAL KNOBS
// ============================================================
function makeKnob(svgId, arcId, ptrId, min, max, init, onChange) {
  const svg = document.getElementById(svgId);
  const arc = document.getElementById(arcId);
  const ptr = document.getElementById(ptrId);
  const cx = 25, cy = 25, r = 18;
  let drag = false, sy = 0, ca = ((init-min)/(max-min))*270;

  function draw(a) {
    const sa = -135*Math.PI/180, ea = (a-135)*Math.PI/180;
    const x1 = cx+r*Math.sin(sa), y1 = cy-r*Math.cos(sa);
    const x2 = cx+r*Math.sin(ea), y2 = cy-r*Math.cos(ea);
    if (a > 1) arc.setAttribute('d', `M${x1} ${y1} A${r} ${r} 0 ${a>180?1:0} 1 ${x2} ${y2}`);
    ptr.setAttribute('x2', cx+r*Math.sin(ea));
    ptr.setAttribute('y2', cy-r*Math.cos(ea));
  }

  draw(ca);
  svg.addEventListener('pointerdown', e => { drag=true; sy=e.clientY; svg.setPointerCapture(e.pointerId); });
  svg.addEventListener('pointermove', e => {
    if (!drag) return;
    ca = Math.max(0, Math.min(270, ca + (sy-e.clientY)*1.5));
    sy = e.clientY;
    draw(ca);
    onChange(min + (ca/270)*(max-min));
  });
  svg.addEventListener('pointerup', () => drag=false);
}

makeKnob('bpm-svg','bpm-arc','bpm-ptr', 40,240,120, v => {
  bpm = Math.round(v);
  document.getElementById('bpm-val').textContent = bpm;
});

makeKnob('drv-svg','drv-arc','drv-ptr', 0,1,0, v => {
  driveAmt = v;
  if (waveShaper) waveShaper.curve = makeCurve(v);
});

// ============================================================
// AUDIO SETUP
// ============================================================
function makeCurve(amount) {
  const n = 256, c = new Float32Array(n), k = amount * 80;
  for (let i = 0; i < n; i++) {
    const x = i*2/n - 1;
    c[i] = k > 0 ? (3+k)*x*20*Math.PI/180 / (Math.PI+k*Math.abs(x)) : x;
  }
  return c;
}

async function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  waveShaper = audioCtx.createWaveShaper();
  waveShaper.curve = makeCurve(0);
  waveShaper.connect(audioCtx.destination);
  await preloadInitial();
}

// ============================================================
// SEQUENCER
// ============================================================
function startSeq() {
  stopSeq();
  let last = 0;
  function tick(t) {
    if (!isPlaying) return;
    const interval = (60/bpm/4)*1000; // recalculate every frame so BPM changes take effect
    if (t - last >= interval) {
      last = t;
      document.querySelectorAll('.step.playing').forEach(el => el.classList.remove('playing'));
      curStep = (curStep + 1) % 16;
      const el = document.querySelector(`.step[data-i="${curStep}"]`);
      if (el) el.classList.add('playing');
      playStep(curStep);
    }
    seqTimer = requestAnimationFrame(tick);
  }
  seqTimer = requestAnimationFrame(tick);
}

function stopSeq() {
  if (seqTimer) cancelAnimationFrame(seqTimer);
  seqTimer = null;
  document.querySelectorAll('.step.playing').forEach(el => el.classList.remove('playing'));
}

// ============================================================
// BUTTONS
// ============================================================
document.getElementById('play-btn').addEventListener('click', async () => {
  await initAudio();
  await audioCtx.resume();
  isPlaying = !isPlaying;
  const btn = document.getElementById('play-btn');
  btn.textContent = isPlaying ? '■' : '▶';
  btn.classList.toggle('on', isPlaying);
  if (isPlaying) { curStep = -1; startSeq(); } else stopSeq();
});

document.getElementById('rnd-btn').addEventListener('click', () => {
  steps.forEach(s => {
    s.on = Math.random() > 0.4;
    s.instIdx = Math.floor(Math.random() * INSTRUMENTS.length);
    s.pitch = 36 + Math.floor(Math.random() * 48);
    s.decay = 0.05 + Math.random() * 1.95;
    s.pa = ((s.pitch-36)/48)*270;
    s.da = ((s.decay-0.05)/1.95)*270;
    s.font = null;
  });
  buildSeq();
});

document.getElementById('new-btn').addEventListener('click', () => {
  // Assign new random instruments to all steps
  steps.forEach(s => {
    s.instIdx = Math.floor(Math.random() * INSTRUMENTS.length);
    s.font = null;
    const el = document.querySelector(`.step[data-i="${steps.indexOf(s)}"]`);
    if (el) {
      const inst = INSTRUMENTS[s.instIdx];
      const instEl = el.querySelector('.step-inst');
      if (instEl) instEl.textContent = inst.name;
    }
  });
  buildSeq();
});

// Init UI
buildSeq();
document.addEventListener('pointerdown', initAudio, { once: true });
</script>
</body>
</html>
